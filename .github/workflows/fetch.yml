name: Descargar subtítulos

on:
  schedule:
    - cron: "30 7 * * *" # todos los días
  workflow_dispatch:

permissions:
  contents: write

concurrency: fetch

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar y descargar
        env:
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/fetch.py
      - name: Guardar cambios
        run: |
          git config user.name "hourtv-subtitles"
          git config user.email "actions@users.noreply.github.com"
          git add -A movie tv state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Subtítulos $(date -u +%F)"
          git push
